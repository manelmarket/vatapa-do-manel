<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel do Manel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/painel/manifest.webmanifest">
<meta name="theme-color" content="#7a1e24">
<link rel="apple-touch-icon" href="/icones/painel-apple-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icones/painel-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel Manel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #f5f3ef; --surface: #ffffff; --surface-2: #f0ece5; --line: #e4ddd2; --line-2: #d3c9ba;
  --fg: #1d1915; --muted: #6d645b; --faint: #9a9087;
  --brand: #7a1e24; --brand-2: #5d161b; --brand-soft: #f6e7e5; --on-brand: #fff;
  --accent: #e8a317; --accent-soft: #fdf1d6;
  --ok: #1d7a45; --ok-bg: #e2f3e8; --warn: #8f5d00; --warn-bg: #fff1d1; --bad: #b42318; --bad-bg: #fde6e3;
  --info: #1f5fa6; --info-bg: #e3eefb; --neutral: #5f5a55; --neutral-bg: #ece8e2;
  --whats: #1f7a45;
  --radius: 14px; --shadow: 0 1px 2px rgba(40, 25, 15, .06), 0 4px 14px -6px rgba(40, 25, 15, .12);
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14110f; --surface: #1d1916; --surface-2: #26211d; --line: #332c26; --line-2: #463d35;
    --fg: #f3ede6; --muted: #b3a89c; --faint: #8a8076;
    --brand: #c4505a; --brand-2: #a83e48; --brand-soft: #3a1d20; --on-brand: #fff;
    --accent: #f0b43a; --accent-soft: #3a2d12;
    --ok: #6fd39a; --ok-bg: #173323; --warn: #f1c25b; --warn-bg: #3a2c0d; --bad: #ff8f84; --bad-bg: #3d1a17;
    --info: #8ab8f0; --info-bg: #182a40; --neutral: #c9c1b8; --neutral-bg: #2b2621;
    --whats: #2a9c5a; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px -8px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14110f; --surface: #1d1916; --surface-2: #26211d; --line: #332c26; --line-2: #463d35;
  --fg: #f3ede6; --muted: #b3a89c; --faint: #8a8076;
  --brand: #c4505a; --brand-2: #a83e48; --brand-soft: #3a1d20; --on-brand: #fff;
  --accent: #f0b43a; --accent-soft: #3a2d12;
  --ok: #6fd39a; --ok-bg: #173323; --warn: #f1c25b; --warn-bg: #3a2c0d; --bad: #ff8f84; --bad-bg: #3d1a17;
  --info: #8ab8f0; --info-bg: #182a40; --neutral: #c9c1b8; --neutral-bg: #2b2621;
  --whats: #2a9c5a; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px -8px rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.mono { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* barra do topo */
.top { position: sticky; top: 0; z-index: 40; background: var(--brand); color: var(--on-brand); padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; }
.top-in { max-width: 920px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.marca { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.marca img { width: 34px; height: 34px; border-radius: 10px; flex: none; background: var(--brand-2); }
.marca-t { min-width: 0; }
.marca-t b { display: block; font-size: 1.02rem; font-weight: 800; line-height: 1.15; }
.marca-t span { display: block; font-size: .78rem; opacity: .82; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icone-btn { flex: none; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; border: 0; background: rgba(255,255,255,.12); color: inherit; }
.icone-btn svg { width: 20px; height: 20px; }
.periodo-bar { max-width: 920px; margin: 10px auto 0; }
.periodo-btn { width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 12px; border: 0; background: rgba(255,255,255,.14); color: inherit; font-weight: 700; text-align: left; }
.periodo-btn svg { width: 18px; height: 18px; flex: none; opacity: .9; }
.periodo-btn span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.periodo-btn small { font-weight: 600; opacity: .8; }

/* conteúdo */
main { max-width: 920px; margin: 0 auto; padding: 14px 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
.view { display: grid; gap: 14px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 6px 2px -4px; }
.sec-h h2 { margin: 0; font-size: 1.02rem; font-weight: 800; }
.sec-h .link { border: 0; background: none; color: var(--brand); font-weight: 700; padding: 4px 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
.card h3 { margin: 0 0 10px; font-size: .95rem; font-weight: 800; }
.vazio { text-align: center; color: var(--muted); padding: 26px 12px; }
.vazio b { display: block; color: var(--fg); font-size: 1rem; margin-bottom: 4px; }

/* indicadores */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 640px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 13px; box-shadow: var(--shadow); min-width: 0; text-align: left; }
button.kpi { cursor: pointer; }
.kpi-k { display: flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.kpi-k i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--line-2)); flex: none; }
.kpi-v { font-size: 1.45rem; font-weight: 800; line-height: 1.15; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-s { font-size: .8rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.destaque { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.kpi.destaque .kpi-k, .kpi.destaque .kpi-s { color: inherit; opacity: .85; }

/* estoque */
.estq-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.estq-num { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.barra { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 10px 0 8px; }
.barra span { display: block; height: 100%; border-radius: inherit; background: var(--accent); width: 0; transition: width .4s ease; }
.estq-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .86rem; color: var(--muted); }

/* gráfico de barras */
.grafico { display: flex; align-items: flex-end; gap: 4px; height: 140px; padding-top: 6px; }
.gb { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.gb-bar { width: 100%; max-width: 34px; border-radius: 6px 6px 2px 2px; background: var(--brand); min-height: 2px; position: relative; }
.gb-bar.zero { background: var(--line); }
.gb-v { font-size: .7rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.gb-l { font-size: .68rem; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.graf-leg { font-size: .8rem; color: var(--muted); margin-top: 6px; }

/* listas de distribuição */
.dist { display: grid; gap: 9px; }
.dist-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; font-size: .9rem; }
.dist-row b { font-variant-numeric: tabular-nums; }
.dist-row .barra { grid-column: 1 / -1; height: 6px; margin: 0; }
.dist-row .barra span { background: var(--c, var(--brand)); }
.duas { display: grid; gap: 14px; }
@media (min-width: 640px) { .duas { grid-template-columns: 1fr 1fr; } }

/* pré-reservas */
.pre { border-color: var(--accent); background: linear-gradient(0deg, var(--surface), var(--surface)) padding-box; }
.pre-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.pre-head h3 { margin: 0; display: flex; align-items: center; gap: 8px; }
.badge { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: var(--accent); color: #3a2400; font-size: .78rem; font-weight: 800; }
.pre-item { border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; display: grid; gap: 4px; background: var(--surface); }
.pre-item + .pre-item { margin-top: 8px; }
.pre-item.nova { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); animation: piscaNova 1.4s ease-out 3; }
@keyframes piscaNova { 50% { background: var(--accent-soft); } }
@media (prefers-reduced-motion: reduce) { .pre-item.nova { animation: none; } }
.pre-top { display: flex; justify-content: space-between; gap: 10px; font-weight: 800; }
.pre-meta { font-size: .86rem; color: var(--muted); }
.pre-btns { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; margin-top: 6px; }

/* botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 14px; border-radius: 12px; border: 1px solid transparent; font-weight: 700; text-decoration: none; text-align: center; line-height: 1.2; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-pri { background: var(--brand); color: var(--on-brand); }
.btn-pri:hover { background: var(--brand-2); }
.btn-sec { background: var(--surface); border-color: var(--line-2); color: var(--fg); }
.btn-sec:hover { background: var(--surface-2); }
.btn-ok { background: var(--whats); color: #fff; }
.btn-mp { background: #009ee3; color: #fff; }
.btn-acc { background: var(--accent); color: #3a2400; }
.btn-bad { background: var(--bad-bg); color: var(--bad); }
.btn-bloco { width: 100%; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .55; pointer-events: none; }
.btns-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* chips e abas */
.abas { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
.abas::-webkit-scrollbar { display: none; }
.aba { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 99px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 700; font-size: .88rem; white-space: nowrap; }
.aba small { font-weight: 800; font-size: .75rem; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.aba[aria-pressed="true"], .aba[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.aba[aria-pressed="true"] small, .aba[aria-selected="true"] small { background: rgba(255,255,255,.2); color: inherit; }
.ferramentas .aba { background: var(--surface-2); border-color: transparent; }
.filtros-linha { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.campo { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); }
.campo:focus-visible, .btn:focus-visible, .aba:focus-visible, .nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select.campo { padding-right: 30px; }
.rotulo { display: block; font-weight: 700; font-size: .86rem; margin: 0 0 5px; }
.dica { font-size: .82rem; color: var(--muted); margin: 5px 0 0; }
.grade-form { display: grid; gap: 12px; }
.grade-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.err { color: var(--bad); font-size: .82rem; font-weight: 600; margin: 4px 0 0; }

/* pílulas */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 99px; font-size: .74rem; font-weight: 800; white-space: nowrap; }
.st-pendente { background: var(--warn-bg); color: var(--warn); }
.st-saiu { background: var(--info-bg); color: var(--info); }
.st-entregue { background: var(--ok-bg); color: var(--ok); }
.st-cancelado { background: var(--neutral-bg); color: var(--neutral); }
.pg-ok { background: var(--ok-bg); color: var(--ok); }
.pg-aberto { background: var(--bad-bg); color: var(--bad); }

/* lista de pedidos */
.pedidos { display: grid; gap: 8px; }
.ped { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; width: 100%; text-align: left; padding: 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.ped.cancelado { opacity: .62; }
.ped-num { grid-row: span 3; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); font-weight: 800; font-size: .95rem; font-variant-numeric: tabular-nums; }
.ped-num small { display: block; font-size: .6rem; font-weight: 700; color: var(--muted); line-height: 1; margin-top: -2px; }
.ped-nome { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ped-val { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.ped-info { font-size: .84rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ped-pills { display: flex; gap: 5px; justify-content: flex-end; flex-wrap: wrap; }
.ped-rod { grid-column: 2 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .78rem; color: var(--faint); }
.ped-acao { border: 1px solid var(--line-2); background: var(--surface); border-radius: 9px; padding: 5px 10px; font-weight: 800; font-size: .78rem; color: var(--fg); }
.mais-itens { text-align: center; }

/* clientes */
.cli { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; width: 100%; text-align: left; padding: 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.avatar { grid-row: span 2; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); font-weight: 800; }
.cli-nome { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cli-info { font-size: .84rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cli-val { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
.cli-val small { display: block; font-weight: 600; font-size: .75rem; color: var(--muted); }

/* lista de opções (tela Mais) */
.menu { display: grid; padding: 4px 0; }
.menu-item { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.menu-item:first-child { border-top: 0; }
.menu-item svg { width: 20px; height: 20px; color: var(--brand); flex: none; }
.menu-item span { flex: 1; font-weight: 700; }
.menu-item small { color: var(--muted); font-weight: 600; }
.menu.card { padding: 0; }
.interruptor { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sw { position: relative; width: 50px; height: 30px; flex: none; border-radius: 99px; border: 0; background: var(--line-2); transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.sw[aria-checked="true"] { background: var(--ok); }
.sw[aria-checked="true"]::after { transform: translateX(20px); }
.links-venda { display: grid; gap: 8px; }
.link-linha { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 9px 10px; border-radius: 10px; background: var(--surface-2); font-size: .84rem; }
.link-linha code { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, monospace; }

/* navegação de baixo */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.nav button { display: grid; justify-items: center; gap: 2px; padding: 6px 4px; border: 0; border-radius: 12px; background: none; color: var(--muted); font-size: .72rem; font-weight: 700; position: relative; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--brand); background: var(--brand-soft); }
.nav .bolinha { position: absolute; top: 2px; right: calc(50% - 20px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--accent); color: #3a2400; font-size: .68rem; font-weight: 800; display: grid; place-items: center; }
.fab { position: fixed; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 45; height: 54px; padding: 0 20px 0 16px; border-radius: 18px; border: 0; background: var(--brand); color: var(--on-brand); font-weight: 800; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 22px -6px rgba(122, 30, 36, .6); }
.fab svg { width: 22px; height: 22px; }
@media (min-width: 960px) { .fab { right: calc(50% - 460px + 16px); } }

/* folhas (janelas de baixo) */
.folha { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.folha-fundo { position: absolute; inset: 0; background: rgba(15, 10, 8, .55); }
.folha-painel { position: relative; width: 100%; max-width: 620px; max-height: 92vh; overflow: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding: 0 16px calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 40px rgba(0,0,0,.25); }
@media (min-width: 700px) { .folha { align-items: center; } .folha-painel { border-radius: 20px; max-height: 88vh; } }
.folha-cab { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; }
.folha-cab h2 { flex: 1; margin: 0; font-size: 1.08rem; font-weight: 800; }
.fechar { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--surface-2); font-size: 1.3rem; line-height: 1; }
.folha-corpo { display: grid; gap: 14px; }

/* detalhe do pedido */
.det-top { display: flex; gap: 12px; align-items: center; }
.det-num { width: 54px; height: 54px; border-radius: 14px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-weight: 800; font-size: 1.2rem; flex: none; }
.det-top b { display: block; font-size: 1.1rem; }
.det-top span { color: var(--muted); font-size: .86rem; }
.dl { display: grid; gap: 8px; margin: 0; }
.dl div { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; font-size: .92rem; }
.dl dt { color: var(--muted); font-weight: 600; }
.dl dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.seg { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 6px; }
.seg button { min-height: 42px; padding: 6px 4px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 700; font-size: .82rem; }
.seg button[aria-checked="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.acoes .btn-bloco { grid-column: 1 / -1; }
.confirmar { padding: 12px; border-radius: 12px; background: var(--bad-bg); color: var(--bad); display: grid; gap: 10px; font-weight: 600; }

/* novo pedido */
.qtd { display: inline-grid; grid-template-columns: 44px 54px 44px; border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; background: var(--surface); }
.qtd button { border: 0; background: var(--surface-2); font-size: 1.3rem; font-weight: 700; }
.qtd output { display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; }
.prev { display: grid; gap: 8px; }
.prev-item { padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: .88rem; }
.prev-item b { display: block; }
textarea.campo { min-height: 150px; resize: vertical; }

async function mudar(id, campos) {
  const antes = estado.pedidos.get(id);
  if (!antes || estado.ocupado.has(id)) return false;
  const extra = { atualizadoEm: Date.now() };
  if (campos.status === "entregue" && antes.status !== "entregue") extra.entregueEm = Date.now();
  if (campos.status === "saiu" && antes.status !== "saiu") extra.saiuEm = Date.now();
  estado.ocupado.add(id);
  estado.pedidos.set(id, { ...antes, ...campos, ...extra });
  renderTudo();
  try { await estado.db.gravar("pedidos", id, { ...campos, ...extra }, true); return true; }
  catch (e) { estado.pedidos.set(id, antes); renderTudo(); toast(msgErro()); return false; }

}
async function registrar(entrada) {
  const feitos = [], repetidos = [];
  const venda = estado.venda.data;
  let prox = numeroProx(venda);
  for (const p of entrada) {
    let codigo = p.codigo;
    if (codigo) {
      if (estado.pedidos.has(codigo)) { repetidos.push(estado.pedidos.get(codigo)); continue; }
      const ja = await estado.db.ler("pedidos", codigo);
      if (ja) { repetidos.push({ id: codigo, ...ja }); continue; }
    } else {
      do { codigo = gerarCodigo(); } while (estado.pedidos.has(codigo));
    }
    const agora = Date.now();
    const preco = Number(estado.venda.preco) || 20;
    const doc = {
      codigo, numero: prox++, venda,
      nome: p.nome, whatsapp: p.whatsapp || "", endereco: p.endereco,
      qtd: p.qtd, preco, total: p.qtd * preco,
      status: "pendente", pagamento: p.pagamentoJa || "aberto",
      link: Number(p.link) || 0, origem: p.codigo ? "link" : "manual",
      formaPag: p.pagamento || "", criadoEm: agora, atualizadoEm: agora,
    };
    await estado.db.gravar("pedidos", codigo, doc, false);
    estado.pedidos.set(codigo, { id: codigo, ...doc });
    feitos.push({ id: codigo, ...doc });
  }
  renderTudo();
  return { feitos, repetidos };
}

/* clientes */
function clientesDe(arr) {
  const mapa = new Map();
  for (const p of arr) {
    const chave = (p.whatsapp || "").replace(/\D/g, "") || "n:" + norm(p.nome);
    let c = mapa.get(chave);
    if (!c) { c = { chave, nome: p.nome, whatsapp: p.whatsapp || "", bairro: bairroDe(p), pedidos: [], gasto: 0, marmitas: 0, ultimo: 0 }; mapa.set(chave, c); }
    c.pedidos.push(p);
    if (ativo(p)) { c.gasto += Number(p.total) || 0; c.marmitas += Number(p.qtd) || 0; }
    if (quandoDe(p) >= c.ultimo) { c.ultimo = quandoDe(p); c.nome = p.nome || c.nome; c.bairro = bairroDe(p); }
  }
  return [...mapa.values()];
}

const CUSTOS = { docs: new Map() };

async function carregarCustos() {

function totalCusto(venda) { const d = CUSTOS.docs.get(venda); return d && Array.isArray(d.itens) ? soma(d.itens, (i) => i.valor) : 0; }
function vendasNoPeriodo() {
  const p = periodoAtual();

  return [...datas].filter((d) => {

  const dt = (ms) => { if (!ms) return ""; const d = new Date(ms); return n2(d.getDate()) + "/" + n2(d.getMonth() + 1) + "/" + d.getFullYear() + " " + n2(d.getHours()) + ":" + n2(d.getMinutes()); };
  const cel = (v) => { const s = String(v == null ? "" : v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const cab = ["Venda (entrega)", "Nº", "Código", "Reservado em", "Cliente", "WhatsApp", "Endereço", "Bairro", "Marmitas", "Preço", "Total", "Situação", "Pagamento", "Forma escolhida pelo cliente", "Link", "Saiu em", "Entregue em"];

    p.qtd, num(p.preco || (p.total / (p.qtd || 1))), num(p.total), STATUS_TXT[p.status] || "Reservado", PAGTO_TXT[p.pagamento] || "A receber", p.formaPag || "",
    Number(p.link) ? nomeLink(Number(p.link)) : "Sem link", dt(p.saiuEm), dt(p.entregueEm)]);
  const csv = "\ufeff" + [cab, ...linhas].map((l) => l.map(cel).join(";")).join("\r\n");
  const nomeArq = "vatapa-pedidos-" + rotuloPeriodo().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".csv";
  try {
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    const a = h("a", { href: url, download: nomeArq, style: "display:none" });
    document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);

  } catch (e) { abrirTexto("Planilha", "Não deu para baixar. Copie o texto e cole numa planilha.", csv, false); }
}

/* ---------- Mercado Pago ---------- */
const MP = { pagos: new Map(), aplicados: new Set(), carregando: false };
async function carregarMp() {
  if (!estado.db || MP.carregando) return;
  MP.carregando = true;
  try {
    const linhas = (await estado.db.rpc("mp_pagamentos", {})) || [];
    MP.pagos = new Map();
    for (const l of linhas) { const ja = MP.pagos.get(l.codigo); MP.pagos.set(l.codigo, { ...l, valor: Number(l.valor) + (ja ? Number(ja.valor) : 0) }); }
    aplicarMp();
  } catch (e) { /* sem Mercado Pago */ }
  MP.carregando = false;
}
function aplicarMp() {
  if (!estado.carregado) return;
  for (const p of estado.pedidos.values()) {
    const pg = MP.pagos.get(p.id);
    if (!pg || pago(p) || !ativo(p) || MP.aplicados.has(p.id)) continue;
    MP.aplicados.add(p.id);
    if (Number(pg.valor) + 0.01 < Number(p.total)) { toast("Mercado Pago: " + (p.nome || "cliente") + " pagou " + brl(pg.valor) + ", mas o pedido é " + brl(p.total) + ". Confira."); continue; }
    mudar(p.id, { pagamento: pg.tipo === "pix" ? "pix" : "cartao", mpPagamento: String(pg.payment_id) }).then((ok) => {
      if (ok) { toast("💳 Pagamento recebido no Mercado Pago: " + (p.nome || "cliente") + " (" + brl(pg.valor) + ")"); tocarAlerta(); }
      else MP.aplicados.delete(p.id);
    });
  }
}

const ALERTA = { ctx: null, som: guarda.ler("vdm-som") !== false, titulo: document.title, piscar: 0 };
function destravarSom() {
  try { if (!ALERTA.ctx) ALERTA.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ALERTA.ctx.state === "suspended") ALERTA.ctx.resume(); } catch (e) { /* sem áudio */ }
}
document.addEventListener("pointerdown", destravarSom, { passive: true });
function tocarAlerta() {
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* sem vibração */ }
  if (!ALERTA.som || !ALERTA.ctx || ALERTA.ctx.state !== "running") return;
  const c = ALERTA.ctx, t0 = c.currentTime;
  [[880, 0], [1175, 0.18], [1568, 0.36]].forEach(([f, d]) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.35, t0 + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.28);
    o.connect(g); g.connect(c.destination); o.start(t0 + d); o.stop(t0 + d + 0.3);
  });
}
function alertarNovas(novas) {
  tocarAlerta();
  toast(novas.length === 1 ? "🔔 Nova pré-reserva: " + novas[0].nome + " (" + novas[0].qtd + ")" : "🔔 " + novas.length + " novas pré-reservas.");
  clearInterval(ALERTA.piscar);
  let lig = false;
  ALERTA.piscar = setInterval(() => {
    if (!document.hidden) { clearInterval(ALERTA.piscar); document.title = ALERTA.titulo; return; }
    lig = !lig; document.title = lig ? "🔔 (" + novas.length + ") Nova pré-reserva!" : ALERTA.titulo;
  }, 900);
}
function rotuloSom() { $("bSom").setAttribute("aria-pressed", String(ALERTA.som)); $("bSom").style.opacity = ALERTA.som ? "1" : ".45"; $("bSom").title = ALERTA.som ? "Som ligado" : "Som desligado"; }
function alternarSom() { ALERTA.som = !ALERTA.som; guarda.gravar("vdm-som", ALERTA.som); destravarSom(); rotuloSom(); if (ALERTA.som) tocarAlerta(); toast(ALERTA.som ? "Som dos avisos ligado." : "Som dos avisos desligado."); }
$("bSom").addEventListener("click", alternarSom);
rotuloSom();

/* ---------- entrada com o código do dono ---------- */
function mostrarEntrada(aviso) {
  const campo = h("input", { class: "campo", type: "password", placeholder: "Código do dono", "aria-label": "Código do dono", autocomplete: "current-password" });
  const erro = h("p", { class: "err", role: "alert", text: aviso || "" });
  erro.hidden = !aviso;
  const botao = h("button", { type: "submit", class: "btn btn-pri btn-bloco", text: "Entrar" });
  const form = h("form", { class: "entrada-card" }, h("img", { src: "/icones/painel-192.png", alt: "" }), h("h1", { text: "Painel do Manel" }), h("p", { class: "muted", style: "margin:0", text: "Digite o código do dono. Ele fica guardado só neste aparelho." }), campo, erro, botao);
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const v = campo.value.trim();
    if (!v) return;
    botao.disabled = true; erro.hidden = true;
    try { await criarBanco(v).ler("config", "estoque"); guarda.gravar("vdm-token", v); $("entrada").remove(); entrar(v); }
    catch (er) { erro.textContent = er.code === "denied" ? "Esse código não foi aceito." : "Não consegui falar com o banco. Confira a internet."; erro.hidden = false; botao.disabled = false; }
  });
  const antigo = $("entrada"); if (antigo) antigo.remove();
  document.body.append(h("div", { class: "entrada", id: "entrada" }, form));
  campo.focus();
}
let timers = [];
async function entrar(token) {
  estado.token = token;
  estado.db = criarBanco(token);
  await carregarVenda();
  await carregarPedidos();
  mostrarView(estado.view);
  carregarPre(); carregarMp(); carregarEspera();
  carregarCustos().then(renderTudo);
  timers.forEach(clearInterval);
  timers = [
    setInterval(() => { if (!document.hidden) carregarPedidos(); }, 5000),
    setInterval(carregarPre, 10000),
    setInterval(() => { if (!document.hidden) { carregarMp(); carregarVenda(); carregarEspera(); carregarCustos(); } }, 20000),
  ];
}
async function iniciar() {
  const salvo = guarda.ler("vdm-token");
  if (!salvo) { mostrarEntrada(""); return; }
  try { await criarBanco(salvo).ler("config", "estoque"); entrar(salvo); }
  catch (er) {
    if (er.code === "denied") { guarda.gravar("vdm-token", null); mostrarEntrada("O código guardado não vale mais. Digite de novo."); }
    else mostrarEntrada("Não consegui falar com o banco. Confira a internet e digite o código.");
  }
}

/* ---------- ligações ---------- */
document.querySelectorAll(".nav button").forEach((b) => b.addEventListener("click", () => mostrarView(b.dataset.view)));
$("bPeriodo").addEventListener("click", abrirPeriodo);
$("fab").addEventListener("click", () => abrirNovo("manual"));
$("bAtualizar").addEventListener("click", async () => { estado.assinatura = ""; await carregarVenda(); await carregarPedidos(); carregarPre(); carregarMp(); carregarEspera(); await carregarCustos(); renderTudo(); toast("Atualizado."); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && estado.db) { carregarPedidos(); carregarPre(); } });
iniciar();
})();

(function appInstalavel() {
  try { if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("/sw.js").catch(() => {}); } catch (e) { /* sem app */ }
})();
</script>
